<!DOCTYPE html>
<html>
<head>
  <title>Notes - Alexandria</title>
  <style>
    body {
      margin: 0;
      background-color: white;
      font-family: "Times New Roman", Times, serif;
      color: black;
    }

    #topBar {
  padding: 15px 20px;
  border-bottom: 1px solid #ccc;
  display: flex;
  align-items: center;
  gap: 15px;
}

#pageTitle {
  font-size: 1.2rem;
  font-weight: normal;
  margin: 0;
}

    #backBtn {
      font-size: 1rem;
      color: #4a6fa5;
      cursor: pointer;
      text-decoration: none;
    }

    #notesList {
      padding: 10px 20px;
      list-style: none;
      margin: 0;
    }

    #notesList h3 {
      font-weight: normal;
      color: #555;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      margin-top: 20px;
    }

    .noteItem {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .noteItem:active {
      background-color: #f5f5f5;
    }

    /* Modal */
    #noteModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #noteModal.hidden {
      display: none;
    }

    #modalBox {
      background-color: white;
      border: 2px solid black;
      border-radius: 12px;
      padding: 25px;
      width: 80%;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #modalBox h2 {
      margin-top: 0;
    }

    #modalCloseBtn {
      display: block;
      margin-top: 15px;
      font-family: "Times New Roman", Times, serif;
      font-size: 1rem;
      padding: 8px 20px;
      background-color: #4a6fa5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="topBar">
  <a id="backBtn" href="home.html">← Back</a>
  <h1 id="pageTitle">Notes</h1>
</div>

<ul id="notesList"></ul>

<div id="noteModal" class="hidden">
  <div id="modalBox">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <p id="modalTags"></p>
    <button id="modalCloseBtn" onclick="closeModal()">Close</button>
  </div>
</div>

<script src="alexandria.js"></script>
<script>
  renderNotesList();

  function renderNotesList() {
    const list = document.getElementById('notesList');
    list.innerHTML = '';

    const groups = {};
    notes.forEach(function(note, index) {
      note.originalIndex = index;
      if (!groups[note.date]) {
        groups[note.date] = [];
      }
      groups[note.date].push(note);
    });

    Object.keys(groups).forEach(function(date) {
      const heading = document.createElement('h3');
      heading.textContent = date;
      list.appendChild(heading);

      groups[date].forEach(function(note) {
        const item = document.createElement('li');
        item.className = 'noteItem';
        item.textContent = note.title;
        item.onclick = function() {
          openModal(note.originalIndex);
        };
        list.appendChild(item);
      });
    });
  }

  function openModal(index) {
    const note = notes[index];
    document.getElementById('modalTitle').textContent = note.title;
    document.getElementById('modalBody').textContent = note.body;

    const tagsContainer = document.getElementById('modalTags');
    tagsContainer.innerHTML = '';
    note.tags.forEach(function(tag) {
      const tagSpan = document.createElement('span');
      tagSpan.textContent = '[' + tag + '] ';
      tagSpan.style.color = getColorForTag(tag);
      tagsContainer.appendChild(tagSpan);
    });

    document.getElementById('noteModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('noteModal').classList.add('hidden');
  }
</script>

</body>
</html>
