<!DOCTYPE html>
<html>
<head>
  <title>Tags - Alexandria</title>
  <style>
    body {
      margin: 0;
      background-color: white;
      font-family: "Times New Roman", Times, serif;
      color: black;
    }

    #topBar {
  padding: 15px 20px;
  border-bottom: 1px solid #ccc;
  display: flex;
  align-items: center;
  gap: 15px;
}

#pageTitle {
  font-size: 1.2rem;
  font-weight: normal;
  margin: 0;
}

    #backBtn {
      font-size: 1rem;
      color: #4a6fa5;
      cursor: pointer;
      text-decoration: none;
    }

    #tagsGrid {
      padding: 15px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .tagChip {
      border: 1px solid #999;
      border-radius: 20px;
      padding: 8px 4px;
      text-align: center;
      font-size: 0.9rem;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tagChip.active {
      border: 2px solid black;
      font-weight: bold;
    }

    #resultsHeading {
      padding: 0 20px;
      color: #555;
      font-weight: normal;
      border-top: 1px solid #ccc;
      margin-top: 10px;
      padding-top: 15px;
    }

    #resultsList {
      padding: 0 20px;
      list-style: none;
      margin: 0;
    }

    .resultItem {
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .resultItem:active {
      background-color: #f5f5f5;
    }

    /* Modal */
    #noteModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #noteModal.hidden {
      display: none;
    }

    #modalBox {
      background-color: white;
      border: 2px solid black;
      border-radius: 12px;
      padding: 25px;
      width: 80%;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
    }

    #modalBox h2 {
      margin-top: 0;
    }

    #modalCloseBtn {
      display: block;
      margin-top: 15px;
      font-family: "Times New Roman", Times, serif;
      font-size: 1rem;
      padding: 8px 20px;
      background-color: #4a6fa5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="topBar">
  <a id="backBtn" href="home.html">← Back</a>
  <h1 id="pageTitle">Tags</h1>
</div>

<div id="tagsGrid"></div>

<h3 id="resultsHeading" style="display:none;">Matching Notes</h3>
<ul id="resultsList"></ul>

<div id="noteModal" class="hidden">
  <div id="modalBox">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <p id="modalTags"></p>
    <button id="modalCloseBtn" onclick="closeModal()">Close</button>
  </div>
</div>

<script src="alexandria.js"></script>
<script>
  let activeTagFilters = [];

  renderTagsGrid();

  function renderTagsGrid() {
    const grid = document.getElementById('tagsGrid');
    grid.innerHTML = '';

    const allTags = [];
    notes.forEach(function(note) {
      note.tags.forEach(function(tag) {
        if (!allTags.includes(tag)) {
          allTags.push(tag);
        }
      });
    });

    allTags.forEach(function(tag) {
      const chip = document.createElement('div');
      chip.className = 'tagChip';
      if (activeTagFilters.includes(tag)) {
        chip.className += ' active';
      }
      chip.textContent = tag;
      chip.style.color = getColorForTag(tag);
      chip.onclick = function() {
        toggleTagFilter(tag);
      };
      grid.appendChild(chip);
    });
  }

  function toggleTagFilter(tag) {
    if (activeTagFilters.includes(tag)) {
      activeTagFilters = activeTagFilters.filter(function(t) {
        return t !== tag;
      });
    } else {
      activeTagFilters.push(tag);
    }
    renderTagsGrid();
    renderResults();
  }

  function renderResults() {
    const heading = document.getElementById('resultsHeading');
    const list = document.getElementById('resultsList');
    list.innerHTML = '';

    if (activeTagFilters.length === 0) {
      heading.style.display = 'none';
      return;
    }

    heading.style.display = 'block';

    const matches = notes.filter(function(note) {
      return activeTagFilters.every(function(tag) {
        return note.tags.includes(tag);
      });
    });

    if (matches.length === 0) {
      const empty = document.createElement('li');
      empty.textContent = 'No matching notes.';
      list.appendChild(empty);
      return;
    }

    matches.forEach(function(note) {
      const item = document.createElement('li');
      item.className = 'resultItem';
      item.textContent = note.title;
      item.onclick = function() {
        openModal(notes.indexOf(note));
      };
      list.appendChild(item);
    });
  }

  function openModal(index) {
    const note = notes[index];
    document.getElementById('modalTitle').textContent = note.title;
    document.getElementById('modalBody').textContent = note.body;

    const tagsContainer = document.getElementById('modalTags');
    tagsContainer.innerHTML = '';
    note.tags.forEach(function(tag) {
      const tagSpan = document.createElement('span');
      tagSpan.textContent = '[' + tag + '] ';
      tagSpan.style.color = getColorForTag(tag);
      tagsContainer.appendChild(tagSpan);
    });

    document.getElementById('noteModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('noteModal').classList.add('hidden');
  }
</script>

</body>
</html>
